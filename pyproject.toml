[project]
name = "rag-tormenta20"
version = "0.1.0"
description = "RAG para Tormenta 20 (RPG de mesa)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-text-splitters>=0.0.1",
    "langchain-huggingface>=0.0.1",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.1",
    "langchain-cohere>=0.0.1",
    "sentence-transformers>=2.2.0",
    "cohere>=4.0.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.0",
    "qdrant-client>=1.19.0",
    "langchain-qdrant>=0.1.0",
    "langchain-classic>=1.0.0",
]

[project.scripts]
rag-chat = "meu_primeiro_rag:main"
rag-avaliar = "avaliar:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "rag_core",
    "meu_primeiro_rag",
    "avaliar",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
